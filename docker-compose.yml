services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: paprika
      MYSQL_USER: admin
      MYSQL_PASSWORD: Admin!2022
      MYSQL_ROOT_PASSWORD: root!2022
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: paprika
      DB_USER: admin
      DB_PASSWORD: Admin!2022
      SMS_ENABLED: "false"
      # значения берутся из файла .env рядом с docker-compose.yml (см. .env.example)
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-mypaprika.net,www.mypaprika.net,web,localhost,127.0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY}
      SMS_LOGIN: ${SMS_LOGIN}
      SMS_PASSWORD: ${SMS_PASSWORD}
      KANNEL_USER: ${KANNEL_USER}
      KANNEL_PASSWORD: ${KANNEL_PASSWORD}
      DEV_TEST_MSISDN: ${DEV_TEST_MSISDN}
      DEV_TEST_TOKEN: ${DEV_TEST_TOKEN}
      DEV_AUTH_TOKEN: ${DEV_AUTH_TOKEN}
      DEV_AUTH_MSISDN: ${DEV_AUTH_MSISDN}
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn apimobile.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    ports:
      - "8000:8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
